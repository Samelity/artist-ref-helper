server:
  port: 8080

spring:
  application:
    name: artist-ref-helper
  datasource:
    # TIMESTAMPTZ 列建议保留 stringtype=unspecified
    url: jdbc:postgresql://localhost:5432/postgres?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP 连接池（Spring Boot 默认池，显式配置便于生产调优）
    hikari:
      pool-name: ArtistRefHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  # ---------- JPA / Hibernate ----------
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 首次建表可用 update；表结构稳定后建议改 validate，避免实体误改线上 schema
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB

# CLIP Python 微服务
clip:
  service:
    base-url: http://127.0.0.1:8000
    connect-timeout-ms: 3000
    read-timeout-ms: 30000
    # 浏览器 /py/** 请求由 Spring Boot 反向代理到 Python，此为该请求等待响应头的超时
    # 批量上传 + CLIP 编码耗时较长，放宽到 300s
    proxy-timeout-seconds: 300

# 本地图库
image:
  search:
    top-k: 20
    threshold: 0.2
    timeout-seconds: 30            # 搜索接口超时（文搜图/图搜图）
    index-timeout-seconds: 300     # 索引重建超时（编码全量图片 + 建 FAISS）

# 网络搜图 API Key 由 Python 服务通过环境变量读取：
#   PIXABAY_API_KEY  - Pixabay 主源
#   PEXELS_API_KEY   - Pexels 副源
#   BAIDU_APPID      - 百度翻译 App ID（中文查询转英文）
#   BAIDU_APPKEY     - 百度翻译密钥

logging:
  level:
    com.example.artist: INFO